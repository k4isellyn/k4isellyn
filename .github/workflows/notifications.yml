name: Sprint Start/End Notifications

on:
  schedule:
    # You can adjust these cron jobs for your 8 sprints
    - cron: '0 8 1,15 * *' # 1st & 15th day of month at 8 AM UTC

jobs:
  sprint-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Sprint Notification
        uses: Ilshidur/action-discord@v2
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          message: |
            📢 **Scrum Sprint Notification**
            Attention team! A sprint is starting/ending.
            Make sure to check your assigned stories and prepare for:
            🔹 Planning  
            🔹 Review  
            🔹 Backlog updates  

            Project Board: https://github.com/users/k4isellyn/projects/1
